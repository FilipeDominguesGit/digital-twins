# SMS twin: build the image and run its self-test on every change;
# publish ghcr.io/filipedominguesgit/sms-twin:<version> when a tag sms-v<version> is pushed.
name: sms

on:
  push:
    branches: [main]
    paths: ['sms/**', '.github/workflows/sms.yml']
    tags: ['sms-v*']
  pull_request:
    paths: ['sms/**', '.github/workflows/sms.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/filipedominguesgit/sms-twin
  API_KEY: ci-key   # synthetic, for the self-test only
  WEBHOOK_SECRET: ci-webhook-secret   # synthetic, for the self-test only

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the image
        env:
          SOURCE: https://github.com/${{ github.repository }}
        run: docker build --label "org.opencontainers.image.source=$SOURCE" -t sms-twin:ci sms

      - name: Start the twins
        # sms-twin delivers incoming messages to the self-test's listener on the host;
        # sms-twin-plain has no webhook.
        run: |
          docker run -d --name sms-twin --add-host host.docker.internal:host-gateway \
            -e TWIN_API_KEY="$API_KEY" -e TWIN_WEBHOOK_URL=http://host.docker.internal:8091/hook \
            -e TWIN_WEBHOOK_SECRET="$WEBHOOK_SECRET" -p 8090:8080 sms-twin:ci
          docker run -d --name sms-twin-plain -e TWIN_API_KEY="$API_KEY" -p 8093:8080 sms-twin:ci
          for port in 8090 8093; do
            for i in $(seq 1 30); do
              curl -fsS "http://localhost:$port/health" && continue 2
              sleep 1
            done
            docker logs sms-twin; docker logs sms-twin-plain
            exit 1
          done

      - name: Self-test with a webhook
        run: dotnet run sms/selftest.cs -- http://localhost:8090 "$API_KEY" "$WEBHOOK_SECRET" "http://*:8091/"

      - name: Self-test without a webhook
        run: dotnet run sms/selftest.cs -- http://localhost:8093 "$API_KEY"

      - name: Publish (tags only)
        if: startsWith(github.ref, 'refs/tags/sms-v')
        env:
          TAG: ${{ github.ref_name }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#sms-v}"
          TWIN_VERSION="$(curl -fsS http://localhost:8090/health | jq -r .version)"
          if [ "$VERSION" != "$TWIN_VERSION" ]; then
            echo "Tag $TAG does not match the twin's version $TWIN_VERSION (app.cs)."
            exit 1
          fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "$IMAGE:$VERSION already exists; versions are never overwritten."
            exit 1
          fi
          docker tag sms-twin:ci "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          echo "Published $IMAGE:$VERSION"

      - name: Stop the twin
        if: always()
        run: docker rm -f sms-twin sms-twin-plain || true
